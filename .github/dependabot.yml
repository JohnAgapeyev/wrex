# Dependabot (pass-2 supply-chain hygiene): wrex runs under sudo in
# CI, so the CI supply chain deserves automated updates.
version: 2
updates:
  # Rust crates: weekly lockfile + manifest PRs (workspace + fuzz are
  # separate lockfiles — cargo audits both).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
  # GitHub Actions: weekly version PRs (the workflows pin major tags;
  # dependabot moves them forward, a human approves).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly