name: mutants

# Pass-2: mutation testing (cargo-mutants) — measures test-suite kill
# strength: which source mutations survive every test we have.
#
# Three tiers (HP3-e extended the codec crates in, advisory-first per
# the verification doctrine's G4: the scores are the product until
# per-crate health justifies gating):
#
#  - mutants-pr (per-PR): `--in-diff` smoke — only mutants inside lines
#    the PR touches, so cost scales with PR size and "survived" means
#    *this PR* introduced a test gap (exit code 2 gates the PR).
#  - mutants-core (release tags + on demand): the full wrex-core scope,
#    GATED since the kill-strength pass (0 missed / 737 mutants — a
#    regression here is red, not advisory).
#  - mutants-codecs (release tags + on demand): every proto crate,
#    ADVISORY per-crate scores (wrex-core's own tests carry the
#    engine; the codec write paths are heavier in the `wrex` crate's
#    integration suites, which cargo-mutants does not run per package
#    — the recorded scores are the honest per-crate state and the
#    promotion-to-gating trigger is "scores healthy" per the doctrine).

on:
  # No cron: every trigger is tied to actual development activity
  # (a PR, a release tag, or a manual dispatch) — no runs while the
  # repo sits idle.
  push:
    tags: ['v*']
  pull_request:
    paths:
      # Same codec-sources trigger as the fuzz-smoke: mutants only
      # change meaning when wrex source or the workflows move.
      - "crates/**"
      - ".github/workflows/mutants.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-pr:
    # PR-scoped smoke: mutate only lines the PR touches (--in-diff),
    # gate on the exit code — a surviving mutant here is a gap *this
    # PR* created (or failed to close), unlike the full-scope run
    # where pre-existing survivors would fail every PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff base needs the PR's merge-base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff against merge-base
        run: |
          git diff "${{ github.event.pull_request.base.sha }}"...HEAD > pr.diff
          if [ -s pr.diff ]; then
            echo "pr-diff lines: $(grep -c '^[+-]' pr.diff)"
          else
            echo "empty diff — nothing to mutate"
          fi
      # Gating run: exit 2 (missed) / 3 (timeout) fails the job and
      # reds the PR. Pre-existing debt outside the diff is invisible,
      # so a red here is always actionable in the PR.
      - name: Mutate the PR's touched lines
        run: cargo mutants --in-place --in-diff pr.diff -- --all-features
        env:
          PROPTEST_RNG_SEED: "31337"
      - name: Summarize
        if: always()
        run: |
          {
            echo "## cargo-mutants: PR diff scope"
            echo
            echo '```'
            if [ -d mutants.out ]; then
              for f in caught missed timeout unviable; do
                [ -f "mutants.out/$f.txt" ] || continue
                printf '%s: %s\n' "$f" "$(grep -c . "mutants.out/$f.txt")"
              done
            else
              echo "mutants.out missing (see artifacts/log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-pr
          path: |
            mutants.out
            mutants.json
            mutants-*.log

  mutants-core:
    # Full-scope kill-strength for wrex-core (the engine crate:
    # encode/dissect/patch/filter/checksum/schema/options — the
    # highest-leverage signal). GATED since the kill-strength pass
    # (737 mutants, 0 missed, 0 timeouts): cargo-mutants exit 2
    # (missed) / 3 (timeout) now means a REAL regression — a surviving
    # engine mutant is a coverage hole by definition (the exclusion
    # list in .cargo/mutants.toml is limited to provably-unkillable
    # classes, so every killable mutant must die).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # mutants.json + mutants.out land in the log + artifacts.
      - run: cargo mutants -p wrex-core --no-shuffle --in-place -- --all-features
        env:
          # Deterministic: the runs stay comparable over time.
          PROPTEST_RNG_SEED: "31337"
      - name: Summarize
        if: always()
        run: |
          {
            echo "## cargo-mutants: wrex-core"
            echo
            echo '```'
            # cargo-mutants writes a mutants.out/ directory with one
            # file per outcome: caught.txt, missed.txt, timeout.txt,
            # unviable.txt — one mutant per line.
            if [ -d mutants.out ]; then
              for f in caught missed timeout unviable; do
                [ -f "mutants.out/$f.txt" ] || continue
                printf '%s: %s\n' "$f" "$(grep -c . "mutants.out/$f.txt")"
              done
            else
              echo "mutants.out missing (see artifacts/log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-core
          path: |
            mutants.out
            mutants.json
            mutants-*.log
  mutants-codecs:
    # HP3-e / G4: per-crate advisory kill-strength scores for the proto
    # codecs (the doctrine's "advisory scores first, promote to gating
    # once healthy"). Measurement, NOT a gate — the artifact is the
    # per-crate score line in the step summary; each crate runs in
    # well under a minute locally (~5-40s each).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Per-crate advisory scores
        # Deterministic (--no-shuffle, the PROPTEST_RNG_SEED convention);
        # one mutants.out per crate under mutants-codecs/<crate>/.
        env:
          PROPTEST_RNG_SEED: "31337"
        run: |
          set -u
          mkdir -p mutants-codecs
          : > summary.txt
          for c in eth arp vlan ip ip6 ip6ext icmp icmpv6 udp tcp dns dhcp dhcp6; do
            mkdir -p "mutants-codecs/$c"
            if cargo mutants -p "wrex-proto-$c" --no-shuffle --in-place \
                -o "mutants-codecs/$c" > "mutants-codecs/$c.log" 2>&1; then
              verdict="clean"
            else
              verdict="missed (advisory)"
            fi
            tail -1 "mutants-codecs/$c.log" | tee -a summary.txt
            echo "  ($verdict)" >> summary.txt
          done
      - name: Summarize
        if: always()
        run: |
          {
            echo "## cargo-mutants: proto crates (advisory, HP3-e G4)"
            echo
            echo '```'
            cat summary.txt 2>/dev/null || echo "(no scores — see artifacts)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-codecs
          path: |
            mutants-codecs
