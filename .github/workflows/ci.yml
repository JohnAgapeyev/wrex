name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # SAFETY-comment gate (pass-2): every unsafe block/fn in wrex-io
      # (the only crate with unsafe) must carry a SAFETY comment within
      # the 3 preceding lines — cheap lint until clippy's
      # undocumented_unsafe_lenses reaches our toolchain.
      - run: |
          python3 - <<'PY'
          import glob, sys
          missing = []
          for path in glob.glob('crates/wrex-io/src/*.rs'):
              lines = open(path).read().split('\n')
              for i, l in enumerate(lines):
                  if 'unsafe {' in l or 'unsafe fn' in l:
                      if not any('SAFETY' in w for w in lines[max(0, i-3):i]):
                          missing.append(f"{path}:{i+1}")
          if missing:
              sys.exit("unsafe blocks missing SAFETY comments:\n" + "\n".join(missing))
          PY
      # man/ is generated from the clap definition + registry schemas;
      # regenerate and fail if committed pages drifted from the source.
      - run: cargo xtask man && git diff --exit-code -- man/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Socket tests auto-skip (WREX_DRIVER_TESTS unset). The run rides
      # the suite-time ratchet (HP3-e): one capture-and-ratchet pass,
      # no extra test time — >2x baseline growth fails with the pointed
      # suite name (the Miri-precedent rule; slow suites move to the
      # extended gate).
      - run: cargo xtask suitetime
        env:
          PROPTEST_RNG_SEED: 31337

  api-surface:
    # HP3-e API-surface ratchet: per-crate public-API snapshots
    # (xtask/api-snapshots/), regenerated-and-diffed like the man pages
    # — "would we freeze this?" now has a diff, so the 1.0 API review
    # is a diff instead of an excavation. Advisory while the snapshots
    # settle (continue-on-error); promotion to blocking follows the
    # same review-the-drift cycle as the man pages did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - run: cargo xtask api-snapshot --check
        continue-on-error: true

  lean-build:
    # ADR 3 (tranche 17-0): the feature graph closes through the codec
    # dep graph. Runtime smokes against the genuinely-lean binaries
    # (test builds unify all features on via the wrex-test dev-dep, so
    # lean verification happens here): a lone proto-dns selection must
    # register exactly its parent-complete closure, and the no-codecs
    # build must register nothing (the honest minimal).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build -p wrex --no-default-features --features proto-dns
          kinds=$(cargo run -q -p wrex --no-default-features --features proto-dns -- fields | grep -E '^[a-z0-9]+ \(rank' | cut -d' ' -f1 | sort)
          # udp stacks on the v6 ext family (tranche 17a), so the dns
          # closure pulls them along: 13 kinds.
          expected=$(printf '%s\n' dns udp ipv4 ipv6 hopopts dstopts routing frag ah esp nonext eth vlan | sort)
          [ "$kinds" = "$expected" ] || { echo "lean closure mismatch:"; echo "$kinds"; exit 1; }
      - run: |
          cargo build -p wrex --no-default-features
          n=$(cargo run -q -p wrex --no-default-features -- fields | grep -cE '^[a-z0-9]+ \(rank' || true)
          [ "$n" = "0" ] || { echo "empty build registered $n kinds"; exit 1; }

  msrv:
    # The workspace rust-version floor (latest stable, 1.99) only
    # constrains direct dependency pins — accidental use of newer std
    # APIs or language features would otherwise surface only at
    # release. `cargo check` on the pinned toolchain catches that per
    # commit (no test run: the suites compile on the floor's own deps
    # either way).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
        with:
          # A distinct key per toolchain: cache artifacts built on 1.99.
          key: msrv-1.99
      - run: cargo check --workspace --all-features --all-targets
      # fuzz/ is excluded from the workspace and carries its own floor
      # (cargo-fuzz pins); check it too so the targets stay MSRV-clean.
      - run: cargo check --all-features
        working-directory: fuzz

  fuzz-smoke:
    # Per-PR fuzz smoke (the cheap cousin of the fuzz.yml release
    # gate): a few seconds of libFuzzer per target against the
    # committed seed corpora — bitstream regressions surface here
    # instead of at release tags. Skipped for PRs touching no codec
    # sources (docs/CI-only changes stay fast). The full 300s/target
    # matrix stays on fuzz.yml (tags + on demand).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip when no codec sources changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(crates/|fuzz/)'; then
            echo "fuzz_smoke=run" >> "$GITHUB_ENV"
          else
            echo "fuzz-smoke: no codec sources changed, skipping"
          fi
      - uses: dtolnay/rust-toolchain@nightly
        if: env.fuzz_smoke == 'run'
      - uses: Swatinem/rust-cache@v2
        if: env.fuzz_smoke == 'run'
        with:
          key: fuzz-smoke
      - run: cargo install --locked cargo-fuzz
        if: env.fuzz_smoke == 'run'
      # Seed corpora are committed under fuzz/corpus/<target>/.
      - name: Smoke all targets (5s budget each)
        if: env.fuzz_smoke == 'run'
        run: |
          for t in fuzz_dissect_eth fuzz_dissect_arp fuzz_dissect_ipv4 fuzz_dissect_ipv6 fuzz_dissect_ip6ext fuzz_dissect_icmp fuzz_dissect_icmpv6 fuzz_dissect_udp fuzz_dissect_tcp fuzz_dissect_dns fuzz_dissect_dhcp fuzz_dissect_dhcp6 fuzz_dissect_vlan fuzz_craft_roundtrip fuzz_scan_session fuzz_http_session fuzz_pcap_reader fuzz_pcap_roundtrip fuzz_mut_strategies fuzz_prober_session fuzz_app_session fuzz_h2_frame_decoder fuzz_hpack fuzz_h2_session fuzz_patch_engine fuzz_filter fuzz_frag_reassembly; do
            cargo +nightly fuzz run "$t" -- -max_total_time=5 -rss_limit_mb=2560 -dict=fuzz/dict/wrex.dict
          done

  driver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Raw sockets on `lo`; GH runners have passwordless sudo. Covers the
      # tranche-1 send/recv roundtrip and the tranche-2 scan ground truth
      # (bound listener -> open, unbound -> closed, udp/icmp semantics).
      # No `--workspace` here: it conflicts with `-p` selection.
      - run: sudo -E env "PATH=$PATH" WREX_DRIVER_TESTS=1 PROPTEST_RNG_SEED=31337 cargo test --all-features -p wrex-io -p wrex

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tshark dnsutils
      # `-- differential` filters to the differential suite; tshark oracle
      # via WREX_DIFF_TSHARK=1, dig subprocess differential via WREX_DIFF_DIG=1,
      # curl subprocess differential via WREX_DIFF_CURL=1 (all always-skip
      # when the tool is absent).
      - run: WREX_DIFF_TSHARK=1 WREX_DIFF_DIG=1 WREX_DIFF_CURL=1 PROPTEST_RNG_SEED=31337 cargo test --workspace --all-features -- differential

  kani:
    # Kani proofs (tranche 4): scoped, tight-bounds harnesses,
    # deterministic — gating per the frozen plan. Harnesses stay tiny
    # (symbolic bytes are the exponential cost driver; the exhaustive
    # pointer-path universes stay with fuzzing — see the harness docs)
    # and run sequentially under a ~6GB virtual-memory ceiling: a
    # memory regression fails the gate instead of swapping the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani*
          key: kani-${{ runner.os }}-v0.68
      - run: cargo install --locked --force kani-verifier && cargo kani setup
      - run: sh -c 'ulimit -v 6291456; exec cargo kani -p wrex-core'
      - run: sh -c 'ulimit -v 6291456; exec cargo kani -p wrex-http'
      - run: sh -c 'ulimit -v 6291456; exec cargo kani -p wrex-pcap'

  coverage:
    # Gated (was advisory-only): --fail-under-lines 85 +
    # --fail-under-regions 85 hold the floor (measured baselines after
    # pass-2: 89.2% lines / 88.2% regions / 72.3% branches). NB: cargo-
    # llvm-cov 0.9 has no branch-metric gate flag — the branch number is
    # monitored via the artifacts; a proper branch gate rides the MC/DC
    # re-landing (the recorded 2026 goal). lcov + html artifacts stay
    # per-commit for inspection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly llvm-cov --workspace --all-features --branch --lcov --output-path lcov.info --fail-under-lines 85 --fail-under-regions 85
        env:
          # Pinned like every other test job: the G1/G6 statistical audits
          # (field_coverage) are seed-dependent — an unpinned run flaked
          # `icmpv6.mld.sources: constant` on a rare-conjunction sample.
          PROPTEST_RNG_SEED: "31337"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      - run: |
          cargo +nightly llvm-cov --workspace --all-features --branch --html --output-dir coverage-html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html
      # MC/DC availability probe (advisory): rustc removed
      # -Zcoverage-options=mcdc in late 2025; re-landing is a 2026 goal.
      - run: |
          {
            echo "### MC/DC availability"
            echo '```'
            cargo xtask coverage --mcdc-probe 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # rustsec/audit-check@v2 (latest major) still targets the Node-20
      # runner; cargo-audit directly is the same engine without the
      # deprecated composite action. Both lockfiles: workspace + fuzz.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock