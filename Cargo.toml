[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.99: no external dependency floors here anymore (hickory-proto 0.26
# fit under 1.88); the floor tracks latest-stable instead because the
# const-eval work (schema tables, checksums) leans on 1.89+ std const
# surfaces (const float arithmetic, const copy_from_slice, const
# str::eq_ignore_ascii_case). No users: the floor rides latest stable.
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wrex = { path = "crates/wrex", version = "0.1.0" }
wrex-core = { path = "crates/wrex-core", version = "0.1.0" }
wrex-io = { path = "crates/wrex-io", version = "0.1.0" }
wrex-session = { path = "crates/wrex-session", version = "0.1.0" }
wrex-scan = { path = "crates/wrex-scan", version = "0.1.0" }
wrex-test = { path = "crates/wrex-test", version = "0.1.0" }
wrex-dns = { path = "crates/wrex-dns", version = "0.1.0" }
wrex-http = { path = "crates/wrex-http", version = "0.1.0" }
wrex-h2 = { path = "crates/wrex-h2", version = "0.1.0" }
wrex-tls = { path = "crates/wrex-tls", version = "0.1.0" }
wrex-pcap = { path = "crates/wrex-pcap", version = "0.1.0" }
wrex-proto-eth = { path = "crates/wrex-proto-eth", version = "0.1.0" }
wrex-proto-arp = { path = "crates/wrex-proto-arp", version = "0.1.0" }
wrex-proto-ip = { path = "crates/wrex-proto-ip", version = "0.1.0" }
wrex-proto-ip6 = { path = "crates/wrex-proto-ip6", version = "0.1.0" }
wrex-proto-ip6ext = { path = "crates/wrex-proto-ip6ext", version = "0.1.0" }
wrex-proto-icmp = { path = "crates/wrex-proto-icmp", version = "0.1.0" }
wrex-proto-icmpv6 = { path = "crates/wrex-proto-icmpv6", version = "0.1.0" }
wrex-proto-udp = { path = "crates/wrex-proto-udp", version = "0.1.0" }
wrex-proto-tcp = { path = "crates/wrex-proto-tcp", version = "0.1.0" }
wrex-proto-vlan = { path = "crates/wrex-proto-vlan", version = "0.1.0" }
wrex-proto-dns = { path = "crates/wrex-proto-dns", version = "0.1.0" }
wrex-proto-dhcp = { path = "crates/wrex-proto-dhcp", version = "0.1.0" }
wrex-proto-dhcp6 = { path = "crates/wrex-proto-dhcp6", version = "0.1.0" }
wrex-mut = { path = "crates/wrex-mut", version = "0.1.0" }
wrex-fuzz = { path = "crates/wrex-fuzz", version = "0.1.0" }
wrex-frag = { path = "crates/wrex-frag", version = "0.1.0" }

bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
libc = "0.2"
hex = "0.4"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
if-addrs = "0.15"
toml = "1.1"
proptest = "1"
etherparse = "0.21"
# DNS differential oracle (in-process). Pinned >= 0.26.1 for
# RUSTSEC-2026-0119 (name-compression DoS); 0.25.x would trip the CI
# audit job.
hickory-proto = "0.26.3"
# DHCP differential oracle (in-process, tranche 7c). MSRV 1.87 fits
# under the workspace 1.88 floor (no bump needed); shares our
# hickory-proto ^0.26 lineage.
dhcproto = "0.15.0"
# HTTP wire parser + typed model (tranche 4; `http` is types-only, the
# vocabulary the reqwest oracle also speaks).
httparse = "1"
http = "1"
# Content-coding decode (tranche 19) + auth plumbing: base64 for the
# Basic scheme; md-5/sha2 for the RFC 7616 digest 401-dance
# (challenge-response is not wire control — ADR-2 reuse).
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
# Content-Encoding decode (tranche 19): the zlib-rs backend is the
# fastest pure-Rust DEFLATE (flate2 intends it as the future default;
# no C toolchain in the product build). brotli-decompressor is
# forbid(unsafe_code) in its default build, decode-only. ruzstd is
# pure Rust (MSRV 1.87, under the 1.99 floor); libzstd-rs is the
# recorded migration trigger once it leaves pre-release, the C `zstd`
# crate the named fallback if the perf-diff delta ever matters.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
brotli-decompressor = "6"
ruzstd = "0.9"
# HTTP differential oracle (in-process; blocking client; rustls-tls so
# the tranche-8a https differential shares an engine lineage — dev-only,
# it never reaches a shipped binary).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
assert_cmd = "2"
predicates = "3"
# TLS engine (tranche 8a): rustls with the ring provider (no aws-lc
# default: keeps MSRV/build simple — rustls 0.23's floor is 1.71, well
# under the workspace 1.88). logging/tls12/std mirror rustls's defaults
# minus the aws-lc-rs provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# System root store for the default (verifying) client path.
rustls-native-certs = "0.8"
# PEM parsing for --tls-ca / recipe tls_ca files.
rustls-pemfile = "2"
# Self-signed test certificates (dev-only: the in-test TLS stub server).
rcgen = "0.14"

[profile.release]
debug = 1