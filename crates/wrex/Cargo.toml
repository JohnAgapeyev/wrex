[package]
name = "wrex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "wrex"

[[bin]]
name = "wrex"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
wrex-core = { workspace = true }
wrex-io = { workspace = true }
wrex-session = { workspace = true }
wrex-scan = { workspace = true }
wrex-dns = { workspace = true }
wrex-http = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

wrex-proto-eth = { workspace = true, optional = true }
wrex-proto-arp = { workspace = true, optional = true }
wrex-proto-ip = { workspace = true, optional = true }
wrex-proto-icmp = { workspace = true, optional = true }
wrex-proto-udp = { workspace = true, optional = true }
wrex-proto-tcp = { workspace = true, optional = true }
wrex-proto-dns = { workspace = true, optional = true }

[features]
default = ["proto-eth", "proto-arp", "proto-ip", "proto-icmp", "proto-udp", "proto-tcp", "proto-dns"]
proto-eth = ["dep:wrex-proto-eth"]
proto-arp = ["dep:wrex-proto-arp"]
proto-ip = ["dep:wrex-proto-ip"]
proto-icmp = ["dep:wrex-proto-icmp"]
proto-udp = ["dep:wrex-proto-udp"]
proto-tcp = ["dep:wrex-proto-tcp"]
proto-dns = ["dep:wrex-proto-dns"]

[dev-dependencies]
wrex-test = { workspace = true }
proptest = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
# craft-parity differential in tests/dns_differential.rs (0.26.3: see
# the workspace pin note).
hickory-proto = { workspace = true }
wrex-proto-dns = { workspace = true, features = ["test-util"] }
# HTTP differential oracle (in-process, blocking; http:// only).
reqwest = { workspace = true }
wrex-http = { workspace = true }