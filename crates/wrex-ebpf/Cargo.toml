[package]
name = "wrex-ebpf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex eBPF instruction model, schema→filter codegen, the userspace VM (tranche 23b/c)"

[dependencies]
# no_std + alloc: the codegen emits, the VM interprets; nothing else.
# (wrex-core is std; the std feature carries it — the emitted code and
# the VM core stay std-free so a future kernel-side build reuses them.)
wrex-core = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["std"]
std = []