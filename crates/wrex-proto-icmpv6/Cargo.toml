[package]
name = "wrex-proto-icmpv6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex ICMPv6 + NDP codec"

[dependencies]
wrex-core = { workspace = true }
bytes = { workspace = true }
# ADR 3: parents are real Cargo deps — a child codec cannot build
# without the crates it stacks on.
wrex-proto-ip6 = { workspace = true }
# Tranche 17a: icmpv6 stacks on the non-terminal v6 ext headers.
wrex-proto-ip6ext = { workspace = true }
hex = { workspace = true }

[dependencies.proptest]
workspace = true
optional = true

[features]
test-util = ["proptest"]

[dev-dependencies]
proptest = { workspace = true }