[package]
name = "wrex-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex test support: strategies, oracles, corpus, CLI harness (dev-only crate)"

[dependencies]
wrex = { workspace = true }
wrex-core = { workspace = true }
wrex-io = { workspace = true }
wrex-pcap = { workspace = true }
wrex-proto-eth = { workspace = true, features = ["test-util"] }
wrex-proto-arp = { workspace = true, features = ["test-util"] }
wrex-proto-ip = { workspace = true, features = ["test-util"] }
wrex-proto-ip6 = { workspace = true, features = ["test-util"] }
wrex-proto-ip6ext = { workspace = true, features = ["test-util"] }
wrex-proto-icmpv6 = { workspace = true, features = ["test-util"] }
wrex-proto-icmp = { workspace = true, features = ["test-util"] }
wrex-proto-udp = { workspace = true, features = ["test-util"] }
wrex-proto-vlan = { workspace = true, features = ["test-util"] }
wrex-proto-tcp = { workspace = true, features = ["test-util"] }
wrex-proto-dns = { workspace = true, features = ["test-util"] }
wrex-proto-dhcp = { workspace = true, features = ["test-util"] }
wrex-proto-dhcp6 = { workspace = true, features = ["test-util"] }
bytes = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
proptest = { workspace = true }
etherparse = { workspace = true }
# DNS differential oracle (in-process). Pinned >= 0.26.1 for
# RUSTSEC-2026-0119 (name-compression DoS); 0.25.x would trip the CI
# audit job. 0.26 uses public fields (message.metadata, record.name…).
hickory-proto = { workspace = true }
# DHCP differential oracle (in-process, tranche 7c; MSRV 1.87 fits the
# workspace floor — see the workspace pin note).
dhcproto = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
# In-test TLS stub server (tranche 8a): rustls ServerConnection in a
# std thread over a rcgen self-signed cert — the https/DoT oracle
# counterpart of the raw-TcpListener stubs.
rustls = { workspace = true }
rcgen = { workspace = true }