[package]
name = "wrex-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex test support: strategies, oracles, corpus, CLI harness (dev-only crate)"

[dependencies]
wrex = { workspace = true }
wrex-core = { workspace = true }
wrex-io = { workspace = true }
wrex-pcap = { workspace = true }
wrex-proto-eth = { workspace = true, features = ["test-util"] }
wrex-proto-arp = { workspace = true, features = ["test-util"] }
wrex-proto-ip = { workspace = true, features = ["test-util"] }
wrex-proto-icmp = { workspace = true, features = ["test-util"] }
wrex-proto-udp = { workspace = true, features = ["test-util"] }
wrex-proto-tcp = { workspace = true, features = ["test-util"] }
wrex-proto-dns = { workspace = true, features = ["test-util"] }
bytes = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
proptest = { workspace = true }
etherparse = { workspace = true }
# DNS differential oracle (in-process). Pinned >= 0.26.1 for
# RUSTSEC-2026-0119 (name-compression DoS); 0.25.x would trip the CI
# audit job. 0.26 uses public fields (message.metadata, record.name…).
hickory-proto = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }