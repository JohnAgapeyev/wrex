source_url = "oracle-capture scenario "scen-kernel-tcp" (tcpdump on veth0; the HP3-b harness)"
imported = "2026-10-28"
start = "auto"
frames = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]

[scenario]
about = "Kernel TCP conversations: curl's three-way handshake + HTTP GET + data + orderly close against an nc listener — the kernel's own options (mss/ws/sack/ts) on the wire (the T22 read-side-typing + T30 fingerprint pre-stage)."
clients = ["curl -s --max-time 2 http://10.9.9.2:8080/hello"]
tools = ["nc: netcat (The GNU Netcat) 0.7.1", "curl: curl 8.23.0 (x86_64-pc-linux-gnu) libcurl/8.23.0 OpenSSL/3.6.5 zlib/1.3.2 brotli/1.2.1 zstd/1.5.7 libidn2/2.3.8 libpsl/0.21.5 libssh2/1.11.1 nghttp2/1.70.0 ngtcp2/1.25.0 nghttp3/1.18.0 mit-krb5/1.22.2", "tcpdump: tcpdump version 4.99.7"]
quirks = "the kernel's SYN options set (mss, ws, sackok, ts) varies by sysctl — quirk of the generating kernel, not contract"
review = "tshark eyeball + the map differential over every frame (see xtask/scenarios.rs)"
