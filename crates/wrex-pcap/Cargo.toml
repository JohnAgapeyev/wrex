[package]
name = "wrex-pcap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex pcap file reader/writers (in-house, no libpcap): classic pcap (all magic variants) + pcapng in, LE-microsecond classic/pcapng out"

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
# Kani proofs live behind cfg(kani); normal builds never see them.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }