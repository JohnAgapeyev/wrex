[package]
name = "wrex-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex core: field/value model, schema, codec traits, encode/dissect engines, checksums, filters"

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Bench tripwires (pass-2): dev-only; `cargo bench -p wrex-core`.
criterion = "0.8"
wrex-test = { workspace = true }
wrex = { workspace = true }
wrex-pcap = { workspace = true }
bytes = { workspace = true }

[[bench]]
name = "hotpaths"
harness = false
[lints.rust]
# Kani proofs live behind cfg(kani); normal builds never see them.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
