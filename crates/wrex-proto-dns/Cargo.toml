[package]
name = "wrex-proto-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wrex DNS codec (RFC 1035): single-question craft, full-message dissection with record sections"

[dependencies]
wrex-core = { workspace = true }
bytes = { workspace = true }
# hex: the --dns-edns-options value grammar (tranche 20a-1).
hex = { workspace = true }
# ADR 3: parents are real Cargo deps — a child codec cannot build
# without the crates it stacks on.
wrex-proto-udp = { workspace = true }

[features]
# proptest strategies for `LayerSpec` (differential suites).
test-util = ["dep:proptest"]

[dependencies.proptest]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }